[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "thecubedz-research-core"
version = "0.2.0"
description = "Deterministic, scope-limited research artifacts for TheCubedz."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
research-core = "research_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
