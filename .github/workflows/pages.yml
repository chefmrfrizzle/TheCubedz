name: Deploy public laboratory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --no-build-isolation -e '.[dev]'
          npm ci

      - name: Verify release contract
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Compute public site configuration
        shell: bash
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            echo "PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
          echo "PUBLIC_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}" >> "$GITHUB_ENV"
          echo "PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          echo "PUBLIC_CONTACT_URL=${{ github.server_url }}/${{ github.repository }}/discussions" >> "$GITHUB_ENV"

      - name: Build GitHub Pages artifact
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
