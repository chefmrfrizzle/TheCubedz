name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science:
    name: Science / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install scientific core
        run: python -m pip install --no-build-isolation -e '.[dev]'

      - name: Verify canonical baseline
        run: python scripts/research.py verify candidates/CANDIDATE-000001.json --reproducible

      - name: Run Python tests
        run: PYTHONPATH=src pytest

  public-release-contract:
    name: Public release contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --no-build-isolation -e '.[dev]'
          npm ci

      - name: Run complete release contract
        run: npm run check

      - name: Confirm no tracked artifact drift
        run: git diff --exit-code -- candidates artifacts data src/core
